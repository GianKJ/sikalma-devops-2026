version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Base de Datos Relacional: PostgreSQL 16 Alpine
  # -------------------------------------------------------------
  sikalma-db:
    image: postgres:16-alpine
    container_name: sikalma-postgres
    restart: always
    environment:
      POSTGRES_DB: sikalma_db
      POSTGRES_USER: sikalma_user
      POSTGRES_PASSWORD: sikalma_password_2026
    ports:
      - "5432:5432"
    volumes:
      - sikalma_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sikalma_user -d sikalma_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sikalma-network

  # -------------------------------------------------------------
  # 2. Backend API REST: Spring Boot 3 + Java 21 (Temurin)
  # -------------------------------------------------------------
  sikalma-backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: sikalma-backend-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: sikalma-db
      DB_PORT: 5432
      DB_NAME: sikalma_db
      DB_USER: sikalma_user
      DB_PASSWORD: sikalma_password_2026
    depends_on:
      sikalma-db:
        condition: service_healthy
    networks:
      - sikalma-network

  # -------------------------------------------------------------
  # 3. Frontend Web SPA: React 18 + Vite + Tailwind CSS + Serve
  # -------------------------------------------------------------
  sikalma-frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: sikalma-frontend-web
    restart: always
    ports:
      - "4200:4200"
    environment:
      PORT: 4200
      VITE_API_URL: http://localhost:3000
    depends_on:
      - sikalma-backend
    networks:
      - sikalma-network

volumes:
  sikalma_pgdata:
    driver: local

networks:
  sikalma-network:
    driver: bridge
