services:
  sikalma-db:
    image: postgres:16-alpine
    container_name: sikalma-postgres-v3
    restart: unless-stopped
    environment:
      POSTGRES_DB: sikalma_db
      POSTGRES_USER: sikalma_user
      POSTGRES_PASSWORD: sikalma_password_2026
    ports:
      - "5433:5432"
    volumes:
      - sikalma_pgdata_v3:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sikalma_user -d sikalma_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sikalma-network

  sikalma-backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    image: thegian/sikalma-backend:latest
    container_name: sikalma-backend-v3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: sikalma-db
      DB_PORT: 5432
      DB_NAME: sikalma_db
      DB_USER: sikalma_user
      DB_PASSWORD: sikalma_password_2026
    depends_on:
      sikalma-db:
        condition: service_healthy
    networks:
      - sikalma-network

  sikalma-frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    image: thegian/sikalma-frontend:latest
    container_name: sikalma-frontend-v3
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      PORT: 4200
      VITE_API_URL: http://localhost:8080
    depends_on:
      - sikalma-backend
    networks:
      - sikalma-network

volumes:
  sikalma_pgdata_v3:
    driver: local

networks:
  sikalma-network:
    driver: bridge
