# Configuracion General de SonarQube para el Proyecto SIKALMA (Cumple Regla 1 y 2)
sonar.projectKey=sikalma-backend
sonar.projectName=SIKALMA-Backend
sonar.projectVersion=2.0.0

# Rutas de codigo fuente y pruebas unitarias
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8

# Binarios de Java compilados y Reporte de Cobertura JaCoCo
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,**/target/site/jacoco/jacoco.xml,**/jacoco.xml
