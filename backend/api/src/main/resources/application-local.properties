# Profile Local (H2 In-Memory con JPA DDL auto-update para ejecucion inmediata)
spring.datasource.url=jdbc:h2:mem:sikalma_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desactivar inicializador de script T-SQL para H2 local
spring.sql.init.mode=never

# Consola web H2 para inspeccionar tablas en http://localhost:3000/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.security.user.name=admin
spring.security.user.password=Admin123!
spring.security.user.roles=ADMINISTRADOR
