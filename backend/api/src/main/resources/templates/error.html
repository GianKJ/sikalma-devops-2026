<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitud no permitida | SIKALMA</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/sitio.css}">
</head>
<body>
<main class="error-page">
    <section class="error-card">
        <span class="error-code" th:text="${status != null ? status : 'Error'}">Error</span>
        <h1>La solicitud no pudo procesarse</h1>
        <p>Actualiza la página e inténtalo nuevamente. No se perdió información del sistema.</p>
        <a class="button button--primary" th:href="@{/}">Volver al inicio</a>
    </section>
</main>
</body>
</html>
