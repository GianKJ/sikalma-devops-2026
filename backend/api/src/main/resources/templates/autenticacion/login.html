<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Ingresar | SIKALMA</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/sitio.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="titulo-login">
        <a class="auth-brand" th:href="@{/}">
            <img th:src="@{/img/isotipo-sikalma.png}" alt="">
            <span>
                <strong th:text="${sikalma.nombreCorto}">SIKALMA</strong>
                <span>Acceso al sistema privado</span>
            </span>
        </a>

        <h1 id="titulo-login">Iniciar sesión</h1>
        <p class="auth-card__intro">Ingresa con las credenciales asignadas por administración.</p>

        <p class="form-message form-message--error" th:if="${param.error}">
            El usuario o la contraseña no son correctos.
        </p>
        <p class="form-message form-message--success" th:if="${param.logout}">
            La sesión se cerró correctamente.
        </p>

        <form th:action="@{/login}" method="post">
            <div class="form-field">
                <label for="username">Correo o usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="form-field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button button--primary" type="submit">Ingresar</button>
        </form>

        <a class="auth-card__back" th:href="@{/}">Volver al sitio público</a>
    </section>
</main>
</body>
</html>
