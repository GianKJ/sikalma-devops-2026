<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Ingresar | SIKALMA</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/sitio.css}">
    <script defer th:src="@{/js/login.js}"></script>
</head>
<body>
<main class="auth-page">
    <span class="auth-bg-shape auth-bg-shape--one" aria-hidden="true"></span>
    <span class="auth-bg-shape auth-bg-shape--two" aria-hidden="true"></span>

    <section class="auth-card" aria-labelledby="titulo-login">
        <a class="auth-brand" th:href="@{/}">
            <img th:src="@{/img/isotipo-sikalma.png}" alt="Isotipo SIKALMA">
            <span>
                <strong th:text="${sikalma.nombreCorto}">SIKALMA</strong>
                <span>Acceso al sistema privado</span>
            </span>
        </a>

        <h1 id="titulo-login">Iniciar sesión</h1>
        <p class="auth-card__intro">Ingresa con las credenciales asignadas según tu rol en el centro.</p>

        <output class="form-message form-message--error" th:if="${param.error}">
            El usuario o la contraseña no son correctos o la cuenta está inactiva.
        </output>
        <output class="form-message form-message--success" th:if="${param.logout}">
            La sesión se cerró correctamente.
        </output>

        <form th:action="@{/login}" method="post">
            <div class="form-field">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="form-field">
                <label for="password">Contraseña</label>
                <div class="password-wrap">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button id="toggle-password-btn" type="button" class="password-toggle">Mostrar</button>
                </div>
            </div>
            <button class="button button--primary" type="submit">Ingresar al sistema</button>
        </form>

        <div class="demo-roles" aria-label="Accesos rápidos de demostración">
            <p class="demo-roles__title">Acceso rápido por rol (demo)</p>
            <div class="demo-roles__grid">
                <button type="button" class="demo-role-btn" data-demo-user="admin" data-demo-pass="Admin123!">Administrador</button>
                <button type="button" class="demo-role-btn" data-demo-user="recepcion" data-demo-pass="Recepcion123!">Recepcionista</button>
                <button type="button" class="demo-role-btn" data-demo-user="maryory" data-demo-pass="Psico123!">Psicóloga</button>
                <button type="button" class="demo-role-btn" data-demo-user="antony" data-demo-pass="Fisio123!">Fisioterapeuta</button>
            </div>
        </div>

        <a class="auth-card__back" th:href="@{/}">Volver al sitio público</a>
    </section>
</main>
</body>
</html>
