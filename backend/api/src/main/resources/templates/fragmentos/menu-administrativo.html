<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="admin-sidebar" th:fragment="menu(seccion)">
    <a class="admin-brand" th:href="@{/admin/inicio}" aria-label="Ir al inicio administrativo">
        <img th:src="@{/img/isotipo-sikalma.png}" alt="">
        <span>
            <strong>SIKALMA</strong>
            <small>Gestión del centro</small>
        </span>
    </a>

    <nav class="admin-nav" aria-label="Navegación administrativa">
        <a th:href="@{/admin/inicio}"
           th:classappend="${seccion == 'inicio'} ? 'is-active'"
           th:attr="aria-current=${seccion == 'inicio'} ? 'page' : null">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
           Inicio
        </a>
        <a th:href="@{/admin/citas}"
           th:classappend="${seccion == 'citas'} ? 'is-active'"
           th:attr="aria-current=${seccion == 'citas'} ? 'page' : null">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
           Citas
        </a>
        <a th:href="@{/admin/pacientes}"
           th:classappend="${seccion == 'pacientes'} ? 'is-active'"
           th:attr="aria-current=${seccion == 'pacientes'} ? 'page' : null">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
           Pacientes
        </a>
        <a th:href="@{/admin/psicologos}"
           th:classappend="${seccion == 'psicologos'} ? 'is-active'"
           th:attr="aria-current=${seccion == 'psicologos'} ? 'page' : null">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.7 1.33 10.28 4 13l8 8 8-8c2.67-2.72 2.54-6.3.42-8.42z"/></svg>
           Psicólogos
        </a>
        <a th:href="@{/admin/especialidades}"
           th:classappend="${seccion == 'especialidades'} ? 'is-active'"
           th:attr="aria-current=${seccion == 'especialidades'} ? 'page' : null">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
           Especialidades
        </a>
        <a th:href="@{/admin/servicios}"
           th:classappend="${seccion == 'servicios'} ? 'is-active'"
           th:attr="aria-current=${seccion == 'servicios'} ? 'page' : null">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
           Servicios
        </a>
    </nav>

    <div class="admin-sidebar__footer">
        <a th:href="@{/}" target="_blank" rel="noopener">Ver sitio público</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Cerrar sesión</button>
        </form>
    </div>
</aside>
</body>
</html>
