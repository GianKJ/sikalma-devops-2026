<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${formulario.id == null ? 'Nuevo psicólogo | SIKALMA' : 'Editar psicólogo | SIKALMA'}"></title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-shell">
<div th:replace="~{fragmentos/menu-administrativo :: menu('psicologos')}"></div>
<main class="admin-content">
    <header class="admin-header admin-header--actions">
        <div><p class="admin-eyebrow">Equipo profesional</p><h1 th:text="${formulario.id == null ? 'Registrar psicólogo' : 'Editar psicólogo'}"></h1></div>
        <a class="button button--secondary" th:href="@{/admin/psicologos}">Cancelar</a>
    </header>

    <section class="admin-section form-section" aria-labelledby="datos-psicologo">
        <form class="entity-form" th:action="@{/admin/psicologos/guardar}" th:object="${formulario}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">
            <div class="form-error-summary" th:if="${#fields.hasAnyErrors()}" role="alert">Revisa los campos señalados.</div>

            <fieldset>
                <legend id="datos-psicologo">Datos profesionales</legend>
                <div class="form-grid">
                    <div class="field"><label for="tipoDocumento">Tipo de documento</label><select id="tipoDocumento" th:field="*{tipoDocumento}"><option value="">Seleccionar</option><option th:each="tipo : ${tiposDocumento}" th:value="${tipo}" th:text="${tipo.etiqueta}"></option></select><span class="field-error" th:errors="*{tipoDocumento}"></span></div>
                    <div class="field"><label for="numeroDocumento">Número de documento</label><input id="numeroDocumento" type="text" th:field="*{numeroDocumento}" maxlength="20"><span class="field-error" th:errors="*{numeroDocumento}"></span></div>
                    <div class="field"><label for="nombres">Nombres</label><input id="nombres" type="text" th:field="*{nombres}" maxlength="100"><span class="field-error" th:errors="*{nombres}"></span></div>
                    <div class="field"><label for="apellidos">Apellidos</label><input id="apellidos" type="text" th:field="*{apellidos}" maxlength="120"><span class="field-error" th:errors="*{apellidos}"></span></div>
                    <div class="field"><label for="colegiatura">Número de colegiatura</label><input id="colegiatura" type="text" th:field="*{colegiatura}" maxlength="30"><span class="field-error" th:errors="*{colegiatura}"></span></div>
                    <div class="field"><label for="modalidad">Modalidad</label><select id="modalidad" th:field="*{modalidad}"><option value="">Seleccionar</option><option th:each="item : ${modalidades}" th:value="${item}" th:text="${item.etiqueta}"></option></select><span class="field-error" th:errors="*{modalidad}"></span></div>
                    <div class="field"><label for="telefono">Teléfono</label><input id="telefono" type="tel" th:field="*{telefono}" maxlength="20"><span class="field-error" th:errors="*{telefono}"></span></div>
                    <div class="field"><label for="correo">Correo</label><input id="correo" type="email" th:field="*{correo}" maxlength="160"><span class="field-error" th:errors="*{correo}"></span></div>
                    <div class="field field--wide"><label for="descripcionProfesional">Presentación profesional</label><textarea id="descripcionProfesional" th:field="*{descripcionProfesional}" maxlength="1200" rows="5"></textarea><span class="field-error" th:errors="*{descripcionProfesional}"></span></div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Especialidades</legend>
                <div class="option-grid" th:if="${!#lists.isEmpty(especialidades)}">
                    <label class="check-field" th:each="especialidad : ${especialidades}"><input type="checkbox" th:field="*{especialidadIds}" th:value="${especialidad.id}"><span th:text="${especialidad.nombre}"></span></label>
                </div>
                <p class="empty-options" th:if="${#lists.isEmpty(especialidades)}">No hay especialidades activas.</p>
            </fieldset>

            <fieldset>
                <legend>Servicios asignados</legend>
                <div class="option-grid" th:if="${!#lists.isEmpty(servicios)}">
                    <label class="check-field" th:each="item : ${servicios}"><input type="checkbox" th:field="*{servicioIds}" th:value="${item.id}"><span th:text="${item.nombre}"></span></label>
                </div>
                <p class="empty-options" th:if="${#lists.isEmpty(servicios)}">No hay servicios activos.</p>
            </fieldset>

            <div class="form-actions"><a class="button button--secondary" th:href="@{/admin/psicologos}">Cancelar</a><button class="button button--primary" type="submit">Guardar psicólogo</button></div>
        </form>
    </section>
</main>
</body>
</html>
