spring.datasource.url=jdbc:postgresql://${DB_HOST:database}:${DB_PORT:5432}/${DB_NAME:sikalma_db}
spring.datasource.username=${DB_USER:sikalma_user}
spring.datasource.password=${DB_PASSWORD:sikalma_password_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=never
spring.thymeleaf.cache=false

spring.security.user.name=admin
spring.security.user.password=Admin123!
spring.security.user.roles=ADMINISTRADOR
