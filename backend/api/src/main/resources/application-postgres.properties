# =========================================================
# Perfil PostgreSQL (Docker y Produccion Cloud) - SIKALMA
# =========================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:sikalma-db}:${DB_PORT:5432}/${DB_NAME:sikalma_db}
spring.datasource.username=${DB_USER:sikalma_user}
spring.datasource.password=${DB_PASSWORD:sikalma_password_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.sql.init.mode=never
spring.thymeleaf.cache=false
